name: Build YULI MUSIC APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodule sources
        run: |
          if [ -z "$(ls -A metroproto 2>/dev/null)" ]; then
            rm -rf metroproto
            git clone --depth 1 https://github.com/MetrolistGroup/metroproto.git metroproto
          fi
          if [ -z "$(ls -A opusDecoder/src/main/jni/libopus 2>/dev/null)" ]; then
            rm -rf opusDecoder/src/main/jni/libopus
            git clone --depth 1 https://github.com/xiph/opus.git opusDecoder/src/main/jni/libopus
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon --no-configuration-cache "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify APK integrity
        run: |
          APK=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
          ls -l "$APK"
          sha256sum "$APK"
          unzip -tq "$APK"

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YULI MUSIC build ${{ github.run_number }}
          files: androidApp/build/outputs/apk/debug/*.apk
